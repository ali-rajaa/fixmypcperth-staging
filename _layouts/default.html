<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <meta name="author" content="Ali Raja – FixMyPC Perth">
  {% if page.keywords %}<meta name="keywords" content="{{ page.keywords }}">{% endif %}
  <link rel="canonical" href="{{ site.url }}{{ page.url | remove: '.html' }}">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

  <meta property="og:type" content="{{ page.og_type | default: 'website' }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url | remove: '.html' }}">
  <meta property="og:image" content="{{ site.url }}/logo.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Marks that JS is running, so the reveal animation can be applied.
       Without this class the content stays visible. -->
  <script>document.documentElement.className += ' js';</script>

  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="theme-color" content="#0F172A">

  <!-- Verified coordinates for 7 Barraberry Retreat, Canning Vale -->
  <meta name="geo.region" content="AU-WA">
  <meta name="geo.placename" content="Canning Vale, Perth, Western Australia">
  <meta name="geo.position" content="{{ site.data.site.latitude }};{{ site.data.site.longitude }}">
  <meta name="ICBM" content="{{ site.data.site.latitude }}, {{ site.data.site.longitude }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Sora + DM Sans, loaded async so they never block first paint -->
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet"></noscript>

  <!-- Page stylesheet first, shared chrome last, so the header always wins -->
  {% if page.page_css %}<link rel="stylesheet" href="{{ page.page_css }}">{% endif %}
  <link rel="stylesheet" href="/assets/css/shell.css?v=1">

  <!-- Every JSON-LD block the page carries, not just the first -->
  {%- if page.schemas %}{% for sc in page.schemas %}
  <script type="application/ld+json">{{ sc }}</script>
  {%- endfor %}{% endif %}

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S0CW1QXBDY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-S0CW1QXBDY');
  </script>
</head>
<body>

{% include header.html %}

<main id="main-content">
{{ content }}
</main>

{% include footer.html %}
{% include sticky-cta.html %}
{% include scripts.html %}

</body>
</html>
